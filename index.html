<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TALEEN — كتالوج الوحدات</title>
<meta name="theme-color" content="#0b1526">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1526; --navy2:#101d33; --gold:#c9a35c; --gold2:#e8c98a; --ink:#0a0f1a;
  --pw:437px; --ph:650px;            /* page size (JS may scale) */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  font-family:Tajawal,system-ui,sans-serif;background:var(--navy);color:#fff}
/* dvh tracks the phone's collapsing address bar; 100% is the fallback */
body{height:100dvh}
body{display:flex;flex-direction:column;
  background:
    radial-gradient(1200px 700px at 50% 18%, #1a2b4a 0%, transparent 60%),
    radial-gradient(900px 500px at 85% 90%, rgba(201,163,92,.10) 0%, transparent 55%),
    linear-gradient(180deg,#0d1930,#0b1526 55%,#080f1d)}
/* subtle luxury dust */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.5px 1.5px at 12% 30%,rgba(232,201,138,.35),transparent 60%),
  radial-gradient(1px 1px at 78% 22%,rgba(232,201,138,.30),transparent 60%),
  radial-gradient(1.5px 1.5px at 60% 75%,rgba(232,201,138,.22),transparent 60%),
  radial-gradient(1px 1px at 30% 85%,rgba(232,201,138,.25),transparent 60%),
  radial-gradient(1px 1px at 90% 60%,rgba(232,201,138,.2),transparent 60%)}

/* ===== Top bar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{font-family:Marcellus,serif;letter-spacing:.35em;color:var(--gold2);font-size:15px}
.brand .sep{width:1px;height:16px;background:rgba(232,201,138,.4)}
.brand .name{font-weight:800;font-size:14px;color:#dfe6f2}
.top-actions{display:flex;gap:8px}
.tbtn{border:1px solid rgba(232,201,138,.35);background:rgba(11,21,38,.5);color:var(--gold2);
  border-radius:999px;padding:8px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.tbtn:hover{background:rgba(201,163,92,.15)}
.tbtn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* ===== Stage =====
   min-height:0 is load-bearing: a flex item defaults to min-height:auto and
   refuses to shrink below its content, so without it the 650px book keeps the
   stage at full height and pushes the controls off any short screen. */
.stage{flex:1;min-height:0;min-width:0;overflow:hidden;
  position:relative;z-index:2;
  touch-action:none;   /* pages are dragged by pointer; no native scroll/zoom */
  /* No selection inside the viewer: a drag over page text creates a selection,
     and the next press on it starts a native drag whose pointercancel kills
     the page turn mid-gesture. */
  user-select:none;-webkit-user-select:none}
/* Absolutely centred rather than grid-centred: the book is wider than a phone
   before it is scaled down, and grid alignment clamps an overflowing item to
   the start edge — which in RTL is the right — throwing it off-screen left. */
.book-wrap{position:absolute;top:50%;left:50%;
  width:calc(var(--pw)*2);height:var(--ph)}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);
  perspective:2600px;transition:transform .8s cubic-bezier(.36,.04,.22,1)}
/* table shadow */
.book::after{content:"";position:absolute;inset-inline:6%;bottom:-34px;height:50px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.55), transparent 70%);filter:blur(6px);z-index:-1}

/* The spread is two FLAT slots — plain divs, no transforms, rendered into
   the browser's normal page tiles. The ONLY 3D element in the document is
   the single .turn panel that exists while a page is mid-turn. An earlier
   build kept all 27 sheets in one preserve-3d tree with backface-visibility
   on every face; WebKit gives each such face its own GPU layer, rasterised
   at devicePixelRatio x pinch-zoom — on an iPhone that is gigabytes, and
   iOS killed the tab ("A problem repeatedly occurred"). Never again: keep
   every face flat unless it is the one actually turning. */
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.pg.left{left:0}
.pg.right{left:var(--pw)}
.turn{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);
  transform-origin:right center;transform-style:preserve-3d;z-index:40;
  transition:transform .78s cubic-bezier(.36,.04,.22,1)}
/* driven directly rather than eased while a finger is on the paper */
.turn.no-anim{transition:none}
/* .front carries the LEFT-page dressing, .back the RIGHT-page dressing —
   shared by the flat slots and the panel so a turning page looks identical */
.face{position:absolute;inset:0;background:#f7f3ea;overflow:hidden}
.turn .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.turn .face.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;border-radius:inherit}
/* rounded outer corners only */
.face.front{border-radius:14px 3px 3px 14px}
.face.back{border-radius:3px 14px 14px 3px}
/* gutter + lighting on pages */
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(270deg, rgba(0,0,0,.20), rgba(0,0,0,.05) 12%, transparent 22%, transparent 88%, rgba(255,255,255,.06) 97%)}
.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg, rgba(0,0,0,.20), rgba(0,0,0,.05) 12%, transparent 22%, transparent 88%, rgba(255,255,255,.06) 97%)}
.face.missing{background:linear-gradient(180deg,#f7f3ea,#ece5d6)}
.face.missing::before{content:"⌘";position:absolute;inset:0;display:grid;place-items:center;
  color:#c9b78f;font-size:34px}
/* stacked page edges */
.edges-r,.edges-l{position:absolute;top:6px;bottom:6px;width:14px;z-index:-1;
  background:repeating-linear-gradient(90deg,#efe9dc 0 2px,#d9d2c2 2px 3px);border-radius:3px}
.edges-r{right:-11px;border-radius:0 4px 4px 0}
.edges-l{left:-11px;border-radius:4px 0 0 4px}

/* ===== The generated leather cover faces ===== */
.leather{position:absolute;inset:0;background:#122036;display:grid;place-items:center;
  border-radius:inherit;overflow:hidden}
.leather img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.leather .css-leather{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 30%, #1b3050 0%, #0f1c33 55%, #0a1425 100%)}
.leather .frame{position:absolute;inset:16px;border:1.5px solid rgba(201,163,92,.85);border-radius:8px;
  box-shadow:inset 0 0 0 4px rgba(201,163,92,.18), inset 0 0 60px rgba(0,0,0,.35)}
.leather .frame::after{content:"";position:absolute;inset:7px;border:1px solid rgba(201,163,92,.45);border-radius:5px}
.cover-copy{position:relative;z-index:2;text-align:center;padding:0 26px;text-shadow:0 2px 18px rgba(0,0,0,.55)}
/* The TALEEN mark heads both covers. It is gold artwork on its own cream
   ground (the panels fade into it, so it cannot be cut out) — shown as a
   framed plaque: rounded corners + a hairline gold keyline. width/height
   are explicit to beat the .face img rule that fills the page. */
.cover-copy .house-mark{display:block;margin:0 auto 16px;
  width:calc(var(--pw)*.46);height:auto;object-fit:contain;
  border-radius:12px;border:1px solid rgba(201,163,92,.65);
  box-shadow:0 0 0 4px rgba(201,163,92,.15), 0 14px 34px rgba(0,0,0,.5)}
/* the closing cover shares the mark, smaller, above the contact details */
.closing .cover-copy .house-mark{width:calc(var(--pw)*.32)}
/* the wordmark lives inside the plaque now; the h1 is only the fallback */
.cover-copy h1.fb{display:none}
.cover-copy.nomark h1.fb{display:block}
/* ===== The light (off-white) front cover =====
   Same cream ground as the TALEEN artwork; multiply blending melts the
   mark's own white ground into the cover so no plaque box shows. */
.leather.light .css-leather{background:
  radial-gradient(120% 90% at 50% 32%, #ffffff 0%, #faf7f0 55%, #efe9db 100%)}
/* no z-index here: a stacking context would isolate the mark's multiply
   blend from the cover ground beneath, bringing the white box back */
.leather.light .cover-copy{z-index:auto}
.leather.light .frame{border-color:rgba(179,138,64,.9);
  box-shadow:inset 0 0 0 4px rgba(179,138,64,.16), inset 0 0 60px rgba(139,109,53,.10)}
.leather.light .frame::after{border-color:rgba(179,138,64,.45)}
.leather.light .cover-copy{text-shadow:none}
/* transparent line-art cut of the mark: its open panels show the cover's
   own cream, which is what the artwork's ground was anyway — no box at all */
.leather.light .house-mark{width:calc(var(--pw)*.6);
  border:none;border-radius:0;box-shadow:none}
.leather.light .tagline{color:#a97e35;opacity:1;font-size:12px;margin-top:2px}
.leather.light h1.fb{color:#a97e35;text-shadow:none}
/* the tagline belongs to the mark, so it travels with it everywhere.
   text-indent offsets the trailing letter-space so it stays optically centred */
.tagline{font-family:Marcellus,serif;text-transform:uppercase;color:var(--gold2);
  text-align:center;white-space:nowrap;text-indent:.34em;letter-spacing:.34em}
.cover-copy .tagline{font-size:10.5px;opacity:.92;margin-bottom:20px}
.cover-copy .rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);margin:0 auto 18px}
.cover-copy h1{font-family:Marcellus,serif;font-weight:400;color:var(--gold2);font-size:44px;letter-spacing:.12em;margin:0 0 8px;line-height:1.1}
.cover-copy .ar-title{font-weight:800;font-size:21px;color:#f1e7d2;margin:0 0 26px}
.cover-copy .subtitle{font-size:13.5px;color:#cfd8e6;font-weight:500;letter-spacing:.05em}
.cover-copy .year{margin-top:30px;font-family:Marcellus,serif;color:rgba(232,201,138,.8);letter-spacing:.4em;font-size:12px}
.closing .cover-copy h2{font-weight:800;font-size:26px;color:#f1e7d2;margin:0 0 14px}
.closing .cover-copy p{margin:6px 0;color:#dfe6f2;font-size:14.5px}
/* the sales agency mark (أصول العقارية): dark lettering on white, so it is
   framed as a light plaque like the TALEEN mark above it */
.closing .cover-copy .agency{display:block;margin:26px auto 0;
  width:calc(var(--pw)*.44);height:auto;object-fit:contain;
  border-radius:10px;border:1px solid rgba(201,163,92,.55);
  box-shadow:0 0 0 4px rgba(201,163,92,.12), 0 10px 26px rgba(0,0,0,.45)}
.closing .cover-copy .phone{direction:ltr;font-family:Marcellus,serif;font-size:20px;color:var(--gold2);letter-spacing:.08em}

/* ===== The brand pages: facing the poster, and facing the price list ===== */
.logo-page .brandmark{position:relative;z-index:2;display:grid;place-items:center;width:100%}
/* sized in page units so it scales with the book; width/height set explicitly
   to override the .face img rule that would otherwise stretch it to fill */
.logo-page .brandmark img.mark{width:calc(var(--pw)*.6);height:auto;
  max-height:calc(var(--ph)*.52);object-fit:contain;
  border-radius:14px;border:1px solid rgba(201,163,92,.65);
  box-shadow:0 0 0 5px rgba(201,163,92,.15), 0 18px 42px rgba(0,0,0,.55)}
.logo-page .tagline{font-size:15px;margin-top:26px;opacity:.95}

/* ===== Story chapter spreads =====
   Right page carries the chapter; left page answers with a pull-quote over a
   watermark of the mark and three facts from the catalogue. No letter-spacing
   on the Arabic — spaced-out Arabic visually severs the joined letters. */
.story-page .story-copy{position:relative;z-index:2;text-align:center;padding:0 46px;
  text-shadow:0 2px 16px rgba(0,0,0,.5)}
.story-page .orn{color:rgba(232,201,138,.8);font-size:13px;margin-bottom:18px}
.story-page .scene-no{font-family:Marcellus,serif;font-size:15px;letter-spacing:.4em;
  text-indent:.4em;color:rgba(232,201,138,.75);margin-bottom:14px}
.story-page .kicker{font-size:15px;font-weight:700;color:var(--gold2);margin-bottom:18px}
.story-page h2{font-weight:800;font-size:24px;color:#f1e7d2;margin:0 0 22px;line-height:1.85}
.story-copy .rule{width:64px;height:1px;margin:0 auto 20px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.story-page .en{font-family:Marcellus,serif;font-size:11px;letter-spacing:.24em;
  color:rgba(232,201,138,.85);line-height:2.1}
.story-page .wm{position:absolute;width:82%;top:50%;left:50%;transform:translate(-50%,-54%);
  opacity:.055;object-fit:contain;border-radius:0}
.logo-page .fallback{display:none;text-align:center}
.logo-page .brandmark.nomark .fallback{display:block}
.logo-page .fallback h1{font-family:Marcellus,serif;font-weight:400;color:var(--gold2);
  font-size:54px;letter-spacing:.42em;margin:22px 0;
  /* letter-spacing pads the right side of the last glyph; nudge it back to centre */
  text-indent:.42em;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.logo-page .fallback .rule{width:150px;height:1px;margin:0 auto;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent)}

/* ===== Bottom bar ===== */
.bottombar{z-index:5;padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-width:0}
.progress{width:min(560px,86vw);height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid rgba(255,255,255,.16);background:rgba(16,29,51,.6);color:#dfe6f2;border-radius:999px;
  padding:7px 13px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.chip:hover{border-color:rgba(232,201,138,.6);color:var(--gold2)}
.chip.active{background:rgba(201,163,92,.18);border-color:var(--gold);color:var(--gold2)}
.chip:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.counter{font-size:12px;color:#9fb0c8;letter-spacing:.06em;min-width:70px;text-align:center}
.navbtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(232,201,138,.4);cursor:pointer;
  background:rgba(11,21,38,.55);color:var(--gold2);font-size:20px;line-height:1;backdrop-filter:blur(6px)}
.navbtn:hover{background:rgba(201,163,92,.18)}
.navbtn:disabled{opacity:.3;cursor:default}
.navbtn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* first-time hint */
.hint{position:fixed;inset-inline:0;bottom:110px;display:grid;place-items:center;z-index:9;pointer-events:none}
.hint span{background:rgba(10,15,26,.8);border:1px solid rgba(232,201,138,.4);color:#f1e7d2;font-size:13px;
  padding:10px 18px;border-radius:999px;backdrop-filter:blur(8px);animation:hintfloat 2.2s ease-in-out infinite}
@keyframes hintfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hint.hide{display:none}

/* ===== Lite viewer (old phones / boot-failure fallback) =====
   Only old-safe CSS in this block — it must render on any browser. */
html.lite-root{overflow:auto;height:auto}
body.lite-mode{display:block;overflow:auto;height:auto}
body.lite-mode .stage{display:none}
body.lite-mode .progress{display:none}
body.lite-mode .navbtn{display:none}
body.lite-mode .counter{display:none}
body.lite-mode .bottombar{position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(8,15,29,.96);border-top:1px solid rgba(232,201,138,.25);
  padding:8px 0;margin:0}
.lite{max-width:640px;margin:0 auto;padding:0 12px 96px}
.lite-cover{text-align:center;padding:26px 10px 6px}
.lite-cover img{width:210px;height:auto;border-radius:12px;
  border:1px solid rgba(201,163,92,.55)}
.lite-tag{font-family:Marcellus,serif;color:#e8c98a;font-size:11px;
  letter-spacing:.3em;margin-top:10px}
.lite-title{font-family:Marcellus,serif;color:#e8c98a;font-size:34px;
  letter-spacing:.15em;margin-top:8px}
.lite-sub{color:#cfd8e6;font-size:13px;margin-top:6px}
.lite-h{color:#e8c98a;font-size:16px;font-weight:700;text-align:center;
  margin:26px 0 10px}
.lite-page{width:100%;height:auto;display:block;margin:0 0 10px;border-radius:8px}
.lite-foot{text-align:center;color:#cfd8e6;font-size:14px;padding:18px 0}
.lite-agency{width:190px;height:auto;border-radius:8px;
  border:1px solid rgba(201,163,92,.5);margin-bottom:10px}
.lite-foot a{color:#e8c98a;text-decoration:none;direction:ltr;unicode-bidi:embed}

@media (prefers-reduced-motion:reduce){
  .turn,.book{transition:transform .01s}
  .hint span{animation:none}
}

/* Touch devices: backdrop blurs are resampled per frame on iOS while the
   book animates beneath them — a steady jank tax during page turns. The
   buttons keep their translucent fill, just without the live blur. */
@media (hover:none){
  .tbtn,.chip,.navbtn,.hint span{backdrop-filter:none;-webkit-backdrop-filter:none}
}

/* ===== Compact chrome: phones (either orientation) and small tablets ===== */
@media (max-width:820px), (max-height:500px){
  .topbar{padding:10px 14px;gap:8px}
  .brand{min-width:0;flex:1}
  .brand .name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .mark{font-size:13px;letter-spacing:.28em;flex:none}
  .tbtn{padding:7px 11px;font-size:11.5px;white-space:nowrap}
  .bottombar{padding:8px 0 calc(10px + env(safe-area-inset-bottom));gap:8px}
  .controls{flex-wrap:nowrap;width:100%;padding:0 10px;gap:8px}
  /* one scrollable row instead of three wrapped ones eating the screen */
  .chips{flex-wrap:nowrap;overflow-x:auto;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    justify-content:flex-start;padding:2px;gap:8px;flex:1}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;font-size:12px}
  .navbtn{flex:none;width:38px;height:38px;font-size:18px}
  .counter{display:none}
  .progress{width:min(560px,92vw)}
  .hint{bottom:96px}
  .hint span{font-size:12px;padding:9px 15px}
}
/* the counter has room again once the chips stop competing for the row */
@media (min-width:560px){ .counter{display:block;min-width:58px;font-size:11px} }

/* A phone on its side has ~390px of height for a 2:3 page — every pixel of
   chrome comes straight out of the floor plan. */
@media (max-height:500px) and (orientation:landscape){
  .topbar{padding:5px 14px}
  .brand .name{display:none}
  .bottombar{padding:3px 0 calc(5px + env(safe-area-inset-bottom));gap:5px}
  .progress{height:2px}
  .navbtn{width:34px;height:34px}
  .chip{padding:5px 11px}
  .hint{bottom:66px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">TALEEN</span><span class="sep"></span><span class="name">كتالوج الوحدات</span>
  </div>
  <div class="top-actions">
    <button class="tbtn" id="fsBtn" type="button">ملء الشاشة</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="book-wrap" id="bookWrap">
    <div class="book" id="book">
      <div class="edges-l" id="edgesL"></div>
      <div class="edges-r" id="edgesR"></div>
      <!-- sheets injected by JS -->
    </div>
  </div>
</main>

<div class="hint" id="hint"><span id="hintText">اسحب الورقة بإصبعك لتقليب الكتاب · باعد بإصبعين للتكبير 📖</span></div>

<footer class="bottombar">
  <div class="progress"><i id="progressFill"></i></div>
  <div class="controls">
    <button class="navbtn" id="prevBtn" type="button" aria-label="السابق">‹</button>
    <div class="chips" id="chips"><!-- section chips generated from SECTIONS in book.js --></div>
    <span class="counter" id="counter"></span>
    <button class="navbtn" id="nextBtn" type="button" aria-label="التالي">›</button>
  </div>
</footer>

<script>
/* Loader — strict ES5 so it parses on ANY phone. Modern browsers get the 3D
   book; anything that can't run it (old Android WebViews, iOS 12 Safari, no
   pointer events) gets the lite scrolling viewer, and if book.js fails to
   boot for any reason the page swaps to lite instead of dying. ?lite=1
   forces the lite viewer for testing or as a shareable escape hatch. */
(function(){
  function load(src){
    var s = document.createElement('script');
    s.src = src; document.body.appendChild(s); return s;
  }
  function lite(){
    if (window.__bookOK || window.__liteOK || lite.done) return;
    lite.done = true; load('lite.js?v=14');
  }
  if (window.location.search.indexOf('lite=1') > -1){ lite(); return; }
  var modern = false;
  try{
    new Function('const a=(x)=>x?.b ?? [...[]].length;');
    modern = ('onpointerdown' in window) &&
             typeof CSS !== 'undefined' && CSS.supports &&
             CSS.supports('transform-style','preserve-3d');
  }catch(e){}
  if (!modern){ lite(); return; }
  /* Crash-loop canary. A browser crash kills the whole page — no JS error,
     no watchdog, nothing this loader can catch in the moment. So each boot
     is counted here, and book.js erases the count once the page has stayed
     alive a while (or leaves normally via pagehide). Two boots in a row
     that never got erased mean the tab is crash-looping on this device —
     the third load gets the lite catalogue instead of a third crash. */
  try{
    var rec = (localStorage.getItem('taleenCrash') || '').split(',');
    var n = +rec[0] || 0, ts = +rec[1] || 0, now = +new Date();
    if (now - ts > 120000) n = 0;
    if (n >= 2){ localStorage.removeItem('taleenCrash'); lite(); return; }
    localStorage.setItem('taleenCrash', (n + 1) + ',' + now);
